<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Exitoso! - Gastrognomo Pizzeria</title>
    <style>
        :root {
            --burgundy: #590404;
            --cream: #EFD9C7;
            --green: #2ecc71;
            --dark: #171111;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f4f6f8;
            color: var(--dark);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .success-container {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: var(--burgundy);
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #444;
            line-height: 1.5;
        }
        .ticket-box {
            background: #faf8f5;
            border: 1px dashed #d1c2b4;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            
            /* FORMATO TICKET PERFECTO */
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.3;
            white-space: pre;         /* Mantiene las líneas exactas de 42 caracteres sin romperlas */
            overflow-x: auto;         /* Permite hacer scroll lateral suave en móvil */
            color: #222;
            width: 100%;
            box-sizing: border-box;
        }
        /* Estilo estético para la barra de desplazamiento en móviles */
        .ticket-box::-webkit-scrollbar {
            height: 6px;
        }
        .ticket-box::-webkit-scrollbar-thumb {
            background: #d1c2b4;
            border-radius: 4px;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            background-color: var(--burgundy);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .btn-volver:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <h1>🎉 ¡Pedido Realizado con Éxito!</h1>
        <p>Gracias por confiar en nosotros. Tu pedido ha sido registrado correctamente y ya se está procesando en el local.</p>

        <!-- Contenedor del ticket con scroll horizontal limpio -->
        <div id="ticketContainer" class="ticket-box">Cargando detalles del pedido...</div>

        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>

    <script>
        // Leer el ticket que guarda pedido.js en la memoria temporal de esta pestaña
        // (no viaja en la dirección web, así que no queda en el historial ni en los registros del servidor)
        let detalleTexto = null;
        try {
            detalleTexto = sessionStorage.getItem('gastrognomo_ultimo_pedido');
        } catch (e) {
            detalleTexto = null;
        }

        const ticketContainer = document.getElementById('ticketContainer');

        if (detalleTexto) {
            // Mostrar el ticket respetando el formato de 42 caracteres
            ticketContainer.textContent = detalleTexto;
        } else {
            ticketContainer.textContent = "No se pudieron cargar los detalles del ticket.";
        }
    </script>
</body>
</html>
