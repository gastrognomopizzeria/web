<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Gastrognomo Pizzeria</title>
    <style>
        :root {
            --burgundy: #590404;
            --cream: #EFD9C7;
            --green: #2ecc71;
            --red: #e74c3c;
            --gray: #706461;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f4f6f8;
            color: #171111;
            padding: 20px;
            margin: 0;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--burgundy);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .date-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="date"] {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
        }
        .day-actions {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        .btn-activar-todas {
            background-color: var(--green);
        }
        .btn-desactivar-todas {
            background-color: var(--red);
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .column {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .column h2 {
            font-size: 20px;
            color: var(--burgundy);
            border-bottom: 2px solid var(--cream);
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .slot-btn {
            padding: 12px 5px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
        }
        .slot-btn:active {
            transform: scale(0.95);
        }
        .slot-available {
            background-color: var(--green);
        }
        .slot-blocked {
            background-color: var(--red);
            opacity: 0.85;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* Capa de bloqueo inicial oculta hasta verificar PIN */
        #panelContenido {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Contenido del panel (oculto por defecto) -->
    <div id="panelContenido">
        <header>
            <h1>🍕 Gestión de Horarios - Gastrognomo</h1>
            <p>Por defecto las horas están cerradas. Haz clic para abrirlas o usa los botones del día</p>
        </header>

        <div class="date-selector">
            <label for="selectDate"><strong>Fecha seleccionada: </strong></label>
            <input type="date" id="selectDate">
        </div>

        <div class="day-actions">
            <button type="button" id="btnActivarTodo" class="btn-action btn-activar-todas">🟢 Activar todas las franjas del día</button>
            <button type="button" id="btnDesactivarTodo" class="btn-action btn-desactivar-todas">🔴 Desactivar todas las franjas del día</button>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background: var(--green);"></div> Disponible (Abierto)</div>
            <div class="legend-item"><div class="legend-dot" style="background: var(--red);"></div> Cerrado / Bloqueado</div>
        </div>

        <div class="grid-container">
            <div class="column">
                <h2>🛍️ Recoger en Local (cada 15 min)</h2>
                <div id="slotsRecoger" class="slots-grid"></div>
            </div>

            <div class="column">
                <h2>🛵 Domicilio (cada 30 min)</h2>
                <div id="slotsDomicilio" class="slots-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔐 CONFIGURACIÓN DEL PIN DE ACCESO
        // ==========================================
        const PIN_CORRECTO = "20267"; // <--- CAMBIA ESTE NÚMERO POR EL TUYO

        function verificarAcceso() {
            const pinIngresado = prompt("Introduce el PIN de acceso para el panel de Gastrognomo:");

            if (pinIngresado === PIN_CORRECTO) {
                // Si es correcto, mostramos el panel
                document.getElementById('panelContenido').style.display = 'block';
                iniciarPanel();
            } else {
                alert("PIN incorrecto. Acceso denegado.");
                // Recarga la página para volver a pedirlo o dejar la pantalla en blanco
                location.reload();
            }
        }

        function iniciarPanel() {
            // CONFIGURACIÓN DE SUPABASE
            const SUPABASE_URL = 'https://refrscscreylowmocfcx.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_XiXjP4gjaQUXf84U6-5QZw_Dw-YhdSu';
            
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const dateInput = document.getElementById('selectDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            const horaFin = 23 * 60 + 30;

            function generarFranjas(inicioMinutos, minutosIntervalo) {
                let franjas = [];
                for (let m = inicioMinutos; m <= horaFin; m += minutosIntervalo) {
                    let horas = Math.floor(m / 60);
                    let mins = m % 60;
                    let horaStr = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                    franjas.push(horaStr);
                }
                return franjas;
            }

            const franjasRecoger = generarFranjas(19 * 60 + 30, 15);
            const franjasDomicilio = generarFranjas(20 * 60, 30);

            async function cargarHorariosAbiertos() {
                const fecha = dateInput.value;
                
                const { data, error } = await supabaseClient
                    .from('horarios_bloqueados')
                    .select('*')
                    .eq('fecha', fecha);

                if (error) {
                    console.error('Error al cargar horarios:', error);
                    return [];
                }
                return data || [];
            }

            async function renderizarCuadricula() {
                const fecha = dateInput.value;
                const abiertos = await cargarHorariosAbiertos();

                // Renderizar Recoger
                const containerRecoger = document.getElementById('slotsRecoger');
                containerRecoger.innerHTML = '';
                franjasRecoger.forEach(hora => {
                    const estaDisponible = abiertos.some(b => b.hora === hora && b.tipo === 'recoger');
                    
                    const btn = document.createElement('button');
                    btn.className = `slot-btn ${estaDisponible ? 'slot-available' : 'slot-blocked'}`;
                    btn.textContent = hora;
                    btn.onclick = () => alternarEstado(fecha, hora, 'recoger', estaDisponible);
                    containerRecoger.appendChild(btn);
                });

                // Renderizar Domicilio
                const containerDomicilio = document.getElementById('slotsDomicilio');
                containerDomicilio.innerHTML = '';
                franjasDomicilio.forEach(hora => {
                    const estaDisponible = abiertos.some(b => b.hora === hora && b.tipo === 'domicilio');
                    
                    const btn = document.createElement('button');
                    btn.className = `slot-btn ${estaDisponible ? 'slot-available' : 'slot-blocked'}`;
                    btn.textContent = hora;
                    btn.onclick = () => alternarEstado(fecha, hora, 'domicilio', estaDisponible);
                    containerDomicilio.appendChild(btn);
                });
            }

            async function alternarEstado(fecha, hora, tipo, estaDisponible) {
                if (estaDisponible) {
                    await supabaseClient
                        .from('horarios_bloqueados')
                        .delete()
                        .eq('fecha', fecha)
                        .eq('hora', hora)
                        .eq('tipo', tipo);
                } else {
                    await supabaseClient
                        .from('horarios_bloqueados')
                        .insert([{ fecha, hora, tipo }]);
                }
                renderizarCuadricula();
            }

            document.getElementById('btnActivarTodo').addEventListener('click', async () => {
                const fecha = dateInput.value;
                if (!confirm(`¿Activar (abrir) todas las franjas para el día ${fecha}?`)) return;

                let registrosAInsertar = [];
                franjasRecoger.forEach(hora => {
                    registrosAInsertar.push({ fecha: fecha, tipo: 'recoger', hora: hora });
                });
                franjasDomicilio.forEach(hora => {
                    registrosAInsertar.push({ fecha: fecha, tipo: 'domicilio', hora: hora });
                });

                await supabaseClient.from('horarios_bloqueados').delete().eq('fecha', fecha);

                const { error } = await supabaseClient
                    .from('horarios_bloqueados')
                    .insert(registrosAInsertar);

                if (error) {
                    alert("Error al activar las franjas.");
                    return;
                }
                renderizarCuadricula();
            });

            document.getElementById('btnDesactivarTodo').addEventListener('click', async () => {
                const fecha = dateInput.value;
                if (!confirm(`¿Desactivar (cerrar) todas las franjas para el día ${fecha}?`)) return;

                const { error } = await supabaseClient
                    .from('horarios_bloqueados')
                    .delete()
                    .eq('fecha', fecha);

                if (error) {
                    alert("Error al desactivar las franjas.");
                    return;
                }
                renderizarCuadricula();
            });

            dateInput.addEventListener('change', renderizarCuadricula);
            renderizarCuadricula();
        }

        // Ejecutar verificación al cargar la página
        verificarAcceso();
    </script>
</body>
</html>
